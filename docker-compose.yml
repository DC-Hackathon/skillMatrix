services:
    pgadmin:
        image: dpage/pgadmin4:latest
        container_name: dc_pgadmin
        restart: always
        ports:
            - "5050:80"
        environment:
            PGADMIN_DEFAULT_EMAIL: pension@bravurasolutions.com
            PGADMIN_DEFAULT_PASSWORD: pension
            PGADMIN_LISTEN_PORT: 80
        volumes:
            - pgadmin-data:/var/lib/pgadmin
        depends_on:
            - postgres

    postgres:
        image: postgres:16.2-alpine
        container_name: dc_db
        ports:
            - "5432:5432"
        environment:
            - POSTGRES_PASSWORD=password
            - POSTGRES_USER=postgres
            - POSTGRES_DB=skillMatrix
        volumes:
            - db:/var/lib/postgresql/data

    app1:
        image: skillmatrixapp:1.0
        container_name: skillmatrixapp1
        build: .
        ports:
            - "8181:8181"
        environment:
            - SPRING_DATASOURCE_URL=jdbc:postgresql://dc_db:5432/skillMatrix
            - SPRING_DATASOURCE_USERNAME=postgres
            - SPRING_DATASOURCE_PASSWORD=password
        depends_on:
            - postgres

    app2:
        image: skillmatrixapp:1.0
        container_name: skillmatrixapp2
        build: .
        ports:
            - "8182:8181"  # Avoiding port conflict
        environment:
            - SPRING_DATASOURCE_URL=jdbc:postgresql://dc_db:5432/skillMatrix
            - SPRING_DATASOURCE_USERNAME=postgres
            - SPRING_DATASOURCE_PASSWORD=password
        depends_on:
            - postgres

    app3:
        image: skillmatrixapp:1.0
        container_name: skillmatrixapp3
        build: .
        ports:
            - "8183:8181"  # Avoiding port conflict
        environment:
            - SPRING_DATASOURCE_URL=jdbc:postgresql://dc_db:5432/skillMatrix
            - SPRING_DATASOURCE_USERNAME=postgres
            - SPRING_DATASOURCE_PASSWORD=password
        depends_on:
            - postgres

volumes:
    db:
        name: db
    pgadmin-data:
        name: dc-pgadmin_data
